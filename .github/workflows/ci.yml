name: CI

# Docs-only changes skip CI: no check reads .md, so the result is known in advance.
# If main ever gets a required status check, docs-only PRs would wait for it forever.
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

# Read-only token: a public repo must not let a workflow write to it
permissions:
  contents: read

env:
  DATABASE_URL: postgres://bulls:ci-only-password@127.0.0.1:5432/bulls

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not a service container: those cannot retry or switch registry when a pull is refused
      - run: scripts/ci-postgres.sh
      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  # The production Mini App against a real server, in Chromium and WebKit
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-postgres.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
