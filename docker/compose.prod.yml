# The whole stack on the VM (docs/deploy.md). From the repository root:
#   docker compose -f docker/compose.prod.yml --env-file .env up -d --build
# Only Caddy is reachable from the internet (80, 443). The database and the server have no
# published ports.

name: bulls-lean

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    <<: *service
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  app:
    <<: *service
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: bulls-lean-app
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      BOT_TOKEN: ${BOT_TOKEN:?}
      WEBAPP_URL: https://${DOMAIN:?}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      # Migrations run at startup
      start_period: 60s
      start_interval: 2s
    mem_limit: 384m

  caddy:
    <<: *service
    build:
      context: ..
      dockerfile: docker/caddy.Dockerfile
      args:
        BOT_USERNAME: ${BOT_USERNAME:-}
    image: bulls-lean-caddy
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates survive restarts; without the volume Caddy would hit Let's Encrypt limits
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

volumes:
  db_data:
  caddy_data:
  caddy_config:
