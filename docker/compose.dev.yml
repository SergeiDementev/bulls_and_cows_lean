# Local PostgreSQL for development and tests. The app itself runs directly on the host.
name: bulls-lean-dev

services:
  db:
    # Same official image via the AWS mirror: Docker Hub rate limits broke CI in v1
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db_data:
